<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftGroup - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../responsivo.css">
</head>
<body>
    <div class="container">
        <div class="painel-esquerdo">
            <div class="conteudo-centralizado">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12L8 7L13 12L20 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="20" cy="5" r="2.5" fill="white"/>
                        <circle cx="13" cy="12" r="2.5" fill="white"/>
                        <circle cx="8" cy="7" r="2.5" fill="white"/>
                        <circle cx="3" cy="12" r="2.5" fill="white"/>
                    </svg>
        <h1>SoftGroup</h1>
                </div>
                
                <div class="bloco-imagem">
                    <img src="../assets/img_login.avif">
                    </div>
                
                <div class="texto-esquerdo">
                    <h2>SoftGroup: Potencialize o talento da sua equipe.</h2>
                    <p>Sua plataforma definitiva para gestão de inteligência corporativa e avaliação de competências.</p>
                </div>
            </div>
        </div>
        
        <div class="painel-direito">
            <div class="conteudo-login">
                <h2>Bem-vindo de volta</h2>
                <p>Acesse o painel utilizando sua conta corporativa.</p>

                <form id="formLogin" class="form-login" autocomplete="on">
                    <label for="emailLogin">E-mail corporativo</label>
                    <input id="emailLogin" type="email" name="email" placeholder="seu.email@softgroup.com" required>
                    <div id="erroLogin" class="erro-login" hidden></div>
                    <button type="submit" class="botao-entrar">Entrar</button>
                </form>

                <div class="separador"><span>ou</span></div>

                <button type="button" class="botao-google" id="btnGoogle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Entrar com Google
                </button>

                <div class="rodape-login">
                    <p>Não tem uma conta corporativa? <a href="mailto:rh@softgroup.com">Entre em contato com o RH</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="../config.js"></script>
    <script src="../api.js"></script>
    <script src="script.js"></script>
</body>
</html>
