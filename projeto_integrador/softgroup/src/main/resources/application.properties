spring.application.name=softgroup

# ==========================================
# Carrega ./.env (se existir) como property source.
# O ".env" deve estar na raiz do diretório onde a aplicação é
# executada (ex.: softgroup/.env quando você roda mvn spring-boot:run
# dentro da pasta softgroup/).
#
# Formato: chave=valor (uma por linha), igual a um .properties.
# O arquivo é IGNORADO pelo Git (.gitignore) — nunca commite.
# Use .env.example como modelo.
# ==========================================
spring.config.import=optional:file:./.env[.properties]

# ==========================================
# DataSource
# Por padrão usamos H2 em arquivo para o projeto rodar localmente sem
# depender de um PostgreSQL externo. Se quiser usar PostgreSQL, basta
# sobrescrever as env vars SPRING_DATASOURCE_* e SPRING_JPA_DATABASE_PLATFORM.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./.data/softgroup;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# ==========================================
# JPA / Hibernate
# O banco e criado pelos scripts nativos do Spring Boot:
#   schema.sql -> cria tabelas, chaves e indices
#   data.sql   -> popula dados iniciais
# ddl-auto=none garante que o Hibernate/JPA nao gere DDL automaticamente.
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Console H2 opcional para inspecionar dados em desenvolvimento.
# DESABILITE EM PRODUÇÃO definindo H2_CONSOLE=false.
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ==========================================
# API only
# O backend nao serve mais o frontend como arquivos estaticos.
# Hospede projeto_integrador/ separadamente e aponte o frontend para
# a URL desta API via projeto_integrador/config.js.
# ==========================================
spring.web.resources.add-mappings=false

# Origem do frontend usada principalmente nos fluxos OAuth.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5500}

# Origens autorizadas a chamar a API com cookie de sessao.
# Em producao, defina APP_CORS_ALLOWED_ORIGIN_PATTERNS com a URL do frontend.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,null}

# ==========================================
# Sessão — importante para persistir autenticação entre requisições
# ==========================================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ==========================================
# Google OAuth2 (OPCIONAL — desligado por padrão).
# Para habilitar, ative o profile "oauth" e defina as envs:
#   set GOOGLE_CLIENT_ID=...        (Windows)
#   set GOOGLE_CLIENT_SECRET=...
#   set SPRING_PROFILES_ACTIVE=oauth
# As propriedades correspondentes ficam em
# src/main/resources/application-oauth.properties.
# Sem o profile, o registration nem é criado e a aplicação sobe limpa,
# usando apenas POST /api/auth/login (modo demo por e-mail).
# ==========================================

# ==========================================
# App
# ==========================================
server.port=8080
