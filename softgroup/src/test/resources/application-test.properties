# Config exclusiva para testes — H2 em memória, sem tocar no .data/ local.
spring.datasource.url=jdbc:h2:mem:softgroup_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=file:src/main/resources/schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# OAuth2 fica desligado em testes — não ativamos o profile "oauth".
